<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07101d"><title>Document | Siva Kumar Portfolio</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');:root{--bg:#07101d;--text:#f4f7ff;--muted:#a8b6cd;--line:rgba(186,207,255,.16);--cyan:#35d8ff;--blue:#4e8cff;--violet:#9a72ff;--pink:#f26bd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 5% 10%,rgba(44,153,255,.14),transparent 29%),radial-gradient(ellipse at 92% 16%,rgba(153,88,255,.13),transparent 27%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(7,16,29,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{width:min(94%,1440px);min-height:74px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:-.05em;font-size:1.15rem;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet),var(--pink));color:transparent;background-clip:text;-webkit-background-clip:text}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-weight:700;font-size:.8rem;text-decoration:none;background:rgba(11,23,40,.7);transition:.2s}.btn:hover{border-color:var(--cyan);background:rgba(53,216,255,.09)}.btn.primary{background:linear-gradient(110deg,var(--cyan),#8a83ff);color:#07101d;border:0}main{width:min(94%,1440px);margin:24px auto 48px}.eyebrow{font:500 .7rem "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}h1{font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.15;letter-spacing:-.05em;margin:8px 0 18px;overflow-wrap:anywhere}.viewer{height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}iframe{width:100%;height:100%;border:0;background:white}.image-view{display:none;width:100%;max-height:calc(100vh - 210px);object-fit:contain;background:#101a29;border:1px solid var(--line);border-radius:15px}.hint{color:var(--muted);font-size:.82rem;margin-top:12px}.error{padding:24px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}@media(max-width:600px){.topin{padding:12px 0;align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{font-size:.74rem;padding:9px 11px}.viewer{height:70vh;min-height:360px}}
</style></head><body><header class="top"><div class="topin"><a class="brand" href="index.html#home">Siva Kumar · Portfolio</a><div class="actions"><a class="btn" id="back" href="index.html#home">← Back</a><a class="btn" href="index.html#certificates">Certificates</a><a class="btn" href="index.html#additional-certifications">Foundation &amp; Future</a><a class="btn" href="index.html#experience">Experience</a><a class="btn primary" id="download" href="#" download>Download file ↓</a></div></div></header><main><div class="eyebrow">Portfolio document viewer</div><h1 id="title">Document</h1><div id="content" class="viewer"><iframe id="pdf" title="Document preview"></iframe></div><img id="image" class="image-view" alt="Certificate or document preview"><p class="hint">Use the navigation links above or your browser’s Back button to return to the portfolio or relevant section.</p></main><script>(function(){const p=new URLSearchParams(location.search),file=p.get('file')||'',title=p.get('title')||'Document';const allowed=/^assets\/[a-zA-Z0-9_./ -]+\.(pdf|jpg|jpeg|png|webp)$/i;const heading=document.getElementById('title'),download=document.getElementById('download');heading.textContent=title;document.title=title+' | Siva Kumar Portfolio';if(!allowed.test(file)||file.includes('..')){document.getElementById('content').innerHTML='<div class="error">This document link is invalid. Return to the portfolio and open the document again.</div>';download.style.display='none';return;}download.href=file;download.setAttribute('download',file.split('/').pop());if(/\.(jpg|jpeg|png|webp)$/i.test(file)){document.getElementById('content').style.display='none';const img=document.getElementById('image');img.src=file;img.style.display='block';}else{document.getElementById('pdf').src=file+'#view=FitH';}document.getElementById('back').addEventListener('click',function(e){if(history.length>1){e.preventDefault();history.back();}});})();</script></body></html>
