<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="#f3f0e7" name="theme-color"/><title>AWS Project | Siva Kumar</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
:root{
 --paper:#f3f0e7;--surface:#fbf9f2;--surface-2:#e9e5d9;--surface-3:#e1e5d8;
 --ink:#252e28;--ink-2:#45534a;--muted:#6d786f;--rule:#cbc9bd;
 --accent:#a94f37;--accent-dark:#893b2a;--sage:#647963;--forest:#34483d;
 --white:#fffdf7;--max:1220px;--ease:cubic-bezier(.2,.7,.25,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.68 "DM Sans",Arial,sans-serif;overflow-x:hidden}
::selection{background:#d7dfce;color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{width:min(90%,var(--max));margin-inline:auto}
.mono{font:500 .66rem/1.5 "DM Mono",monospace;letter-spacing:.045em;color:var(--muted)}
.progress{position:fixed;z-index:150;top:0;left:0;width:0;height:3px;background:var(--accent)}
.nav{position:fixed;z-index:120;top:0;left:0;right:0;background:rgba(243,240,231,.96);border-bottom:1px solid var(--rule);transition:background .2s,border-color .2s}
.nav.scrolled{background:rgba(243,240,231,.985);border-color:#b9b8ac;box-shadow:0 2px 8px rgba(37,46,40,.04)}
.navin{height:78px;display:flex;align-items:center;justify-content:space-between;gap:26px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;font-size:.84rem;font-weight:700;letter-spacing:.015em}
.brand-stamp{display:grid;place-items:center;width:36px;height:36px;background:var(--accent);color:var(--white);font:500 .7rem "DM Mono",monospace;transform:rotate(-3deg);box-shadow:4px 4px 0 #d6d0c0}
.brand-name{display:flex;flex-direction:column;line-height:1.18}
.brand-name small{margin-top:3px;color:var(--muted);font:500 .54rem "DM Mono",monospace;letter-spacing:.07em;text-transform:uppercase}
.navlinks{display:flex;align-items:center;gap:clamp(10px,1.5vw,22px)}
.navlinks a{position:relative;padding:8px 0;color:#58645c;font-size:.72rem;font-weight:600;white-space:nowrap;transition:color .18s}
.navlinks a:after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:var(--accent);transition:right .18s var(--ease)}
.navlinks a:hover,.navlinks a.active{color:var(--accent-dark)}
.navlinks a:hover:after,.navlinks a.active:after{right:0}
.nav-cta{flex:0 0 auto;padding:9px 13px;border:1px solid var(--ink);border-radius:2px;font-size:.7rem;font-weight:700;transition:background .18s,color .18s,border-color .18s}
.nav-cta:hover{background:var(--accent);border-color:var(--accent);color:var(--white)}
.menu-btn{display:none;padding:8px 11px;border:1px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);font-size:.76rem}
main{display:block}
.hero{position:relative;min-height:720px;padding:150px 0 54px;display:flex;align-items:center;border-bottom:1px solid var(--ink);background:var(--paper)}
.hero:before{content:none!important;display:none!important}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.07fr) minmax(360px,.93fr);align-items:center;gap:clamp(36px,5.6vw,78px)}
.availability{display:flex;align-items:center;gap:10px;margin:0 0 23px;padding:0 0 0 12px;border-left:3px solid var(--accent);color:var(--muted);font:500 .64rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.status-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--sage)}
.hero h1{max-width:700px;margin:0;color:var(--ink);font:400 clamp(3.6rem,6.7vw,6.5rem)/.98 "DM Serif Display",Georgia,serif;letter-spacing:-.045em}
.hero h1 .name{color:var(--accent);font-style:italic;white-space:nowrap}
.hero-copy{max-width:620px;margin:25px 0 0;color:var(--ink-2);font-size:1.03rem;line-height:1.9}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:27px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;padding:10px 15px;border:1px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);font-size:.73rem;font-weight:700;line-height:1.3;transition:background .18s,color .18s,border-color .18s,transform .18s}
.button:hover{transform:translateY(-2px);background:var(--ink);color:var(--white)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--white);box-shadow:4px 4px 0 rgba(169,79,55,.14)}
.button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);box-shadow:4px 4px 0 rgba(169,79,55,.1)}
.button.secondary{background:transparent;color:var(--ink)}
.button.secondary:hover{background:var(--ink);border-color:var(--ink);color:var(--white)}
.hero-right{min-height:475px;display:flex;align-items:center;justify-content:center;position:relative}
.workflow-sheet{position:relative;display:flex;flex-direction:column;width:min(100%,490px);min-height:625px;padding:25px 27px 20px;background:#e4e8dc;border:1px solid #aeb7a8;box-shadow:12px 12px 0 rgba(169,79,55,.13);color:var(--ink);transform:rotate(1deg)}
.workflow-sheet:before{content:"";position:absolute;inset:8px;border:1px solid rgba(37,46,40,.12);pointer-events:none}
.sheet-head,.sheet-foot{position:relative;display:flex;justify-content:space-between;gap:15px;color:#657366;font:500 .56rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.sheet-head{padding-bottom:14px;border-bottom:1px solid rgba(37,46,40,.2)}
.sheet-title{position:relative;min-height:124px;padding:22px 0 15px;font:400 clamp(2.2rem,3.7vw,3.1rem)/1 "DM Serif Display",Georgia,serif;letter-spacing:-.035em}
.sheet-title em{color:var(--accent);font-style:italic}
.workflow-flow{position:relative;min-height:182px;padding:0 0 11px}
.workflow-step{position:relative;margin-left:12px;padding:12px 14px 11px 56px;border-left:1px solid #a5b09f;background:rgba(251,249,242,.58)}
.step-index{position:absolute;left:13px;top:14px;color:var(--accent);font:500 .57rem "DM Mono",monospace}
.workflow-step strong{display:block;font-size:.82rem;font-weight:700;line-height:1.35}
.workflow-step small{display:block;margin-top:3px;color:#69766b;font-size:.67rem;line-height:1.45}
.workflow-step-focus{border-left:3px solid var(--accent);background:rgba(251,249,242,.92)}
.workflow-step-output{border-left:1px solid var(--sage)}
.workflow-link{height:20px;display:flex;align-items:center;gap:10px;margin-left:26px;color:var(--accent)}
.workflow-link i{width:28px;height:1px;background:#9ba695}
.sheet-code{position:relative;min-height:82px;margin:8px 0 15px;padding:12px 14px;border:1px solid rgba(37,46,40,.15);background:rgba(251,249,242,.74);color:#56645a;font:500 .62rem/1.6 "DM Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet-code b{color:var(--accent);font-weight:500}
.sheet-foot{margin-top:auto;min-height:48px;align-items:center;padding-top:13px;border-top:1px solid rgba(37,46,40,.2)}
.sheet-foot strong{color:var(--accent);font:500 .75rem "DM Mono",monospace}
.showcase-controls{display:flex;align-items:center;justify-content:space-between;gap:7px;flex:none;width:150px;margin-left:auto}.showcase-controls button{display:grid;place-items:center;width:30px;height:30px;border:1px solid #aeb7a8;border-radius:2px;background:transparent;color:var(--ink);font-size:1rem;line-height:1;cursor:pointer;transition:background .16s,border-color .16s,color .16s}.showcase-controls button:hover{border-color:var(--accent);background:#f3e6df;color:var(--accent-dark)}.showcase-controls output{min-width:49px;text-align:center;color:var(--accent);font:500 .63rem "DM Mono",monospace;font-variant-numeric:tabular-nums}
.inline-detail-panel[hidden]{display:none}.inline-detail-panel{margin-top:22px;padding:clamp(18px,3vw,28px);border:1px solid var(--rule);background:#eeece2;scroll-margin-top:100px}.inline-detail-panel .aws-route-head{margin-bottom:18px}.inline-detail-panel .aws-peering-layout{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}.inline-detail-panel .sap-detail-route-grid .aws-evidence-list{gap:12px}.inline-detail-panel .sap-detail-route-grid .aws-evidence-item img{max-height:460px;object-fit:contain}
.aws-route-view{scroll-margin-top:100px}.aws-route-view:empty{display:none}.aws-route-view:not(:empty){margin:24px 0 28px;padding:clamp(18px,3vw,28px);border:1px solid var(--rule);background:#eeece2}

.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:33px;color:#758076}
.scroll-cue{display:flex;align-items:center;gap:9px}.scroll-cue:before{content:"";width:25px;height:1px;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:32px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:17px 20px 18px 0;margin-right:18px;border:0;background:transparent}
.stat strong{display:block;color:var(--accent);font:400 2.1rem/1.15 "DM Serif Display",Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font:500 .6rem/1.5 "DM Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
section{padding:92px 0;border-bottom:1px solid var(--rule);scroll-margin-top:78px}
.section-top{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:33px}
.section-number{margin-bottom:10px;color:var(--accent);font-size:.62rem}
.section-title{display:block;margin:0;color:var(--ink);font:400 clamp(2.5rem,4.8vw,4.5rem)/1.02 "DM Serif Display",Georgia,serif;letter-spacing:-.035em}
.section-title:after{content:"";display:block;width:48px;height:2px;margin-top:15px;background:var(--accent)}
.section-title .gradient,.section-title span.gradient{background:none!important;color:var(--accent)!important}
.section-note{max-width:370px;margin:0;color:var(--muted);font-size:.82rem;line-height:1.75}
.about-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px}
.about-text{color:var(--ink-2);font-size:.94rem;line-height:1.9}
.about-text p{margin:0 0 16px}.about-text strong{color:var(--ink);font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--rule)}
.info-card{display:grid;grid-template-columns:42px 118px 1fr;gap:13px;align-items:start;padding:15px 0;border:0;border-bottom:1px solid var(--rule);background:transparent}
.info-icon{margin:0;color:var(--accent)!important;font:400 1.2rem "DM Serif Display",Georgia,serif}
.info-card h3{margin:3px 0 0;color:var(--ink);font:500 .65rem "DM Mono",monospace;letter-spacing:.035em;text-transform:uppercase}
.info-card p{margin:0;color:var(--muted);font-size:.75rem;line-height:1.75}
.timeline{border-top:1px solid var(--ink)}
.experience{display:grid;grid-template-columns:175px minmax(0,1fr) 24px;gap:25px;padding:23px 0;border-bottom:1px solid var(--rule)}
.experience .date{padding-top:5px;color:var(--accent)!important;font-size:.62rem}
.experience h3{margin:0 0 7px;color:var(--ink);font:400 1.35rem/1.25 "DM Serif Display",Georgia,serif;letter-spacing:0}
.experience p{max-width:790px;margin:0;color:var(--muted);font-size:.82rem;line-height:1.8}
.experience .symbol{display:flex;justify-content:center;padding-top:4px;color:var(--accent);font-size:1rem}
.experience-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.project-card{display:grid;grid-template-columns: minmax(150px,.72fr) minmax(0,1.28fr);min-width:0;border:1px solid var(--rule);border-radius:2px;background:var(--surface);box-shadow:4px 4px 0 rgba(37,46,40,.035);overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.project-card:hover{transform:translateY(-2px);border-color:#aeb0a3;box-shadow:6px 7px 0 rgba(169,79,55,.08)}
.sap-genai-project{grid-column:1/-1;grid-template-columns:minmax(230px,.75fr) minmax(0,1.25fr)}
.project-visual{min-height:220px;display:grid;place-items:center;padding:18px;overflow:hidden;background:#e4e8dc}
.sap-genai-visual{background:#e3e8d8!important}.salary-project .project-visual{background:#e8e2d4!important}.movie-project .project-visual{background:#efe1d9!important}.marks-project .project-visual{background:#e0e6e1!important}
.code-art{max-width:100%;padding:16px;border:1px solid rgba(37,46,40,.22);background:rgba(251,249,242,.86);color:#526057;font:500 .67rem/1.95 "DM Mono",monospace;overflow-wrap:anywhere;box-shadow:5px 5px 0 rgba(37,46,40,.05)}
.code-art b{color:var(--accent);font-weight:500}
.project-content{display:flex;flex-direction:column;min-width:0;padding:20px 21px}
.project-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:500 .58rem "DM Mono",monospace;letter-spacing:.025em}
.project-meta span:first-child{color:var(--accent)}
.project-content h3{margin:11px 0 8px;color:var(--ink);font:400 1.2rem/1.25 "DM Serif Display",Georgia,serif;letter-spacing:0}
.sap-genai-project .project-content h3{font-size:1.55rem}
.project-content>p{margin:0;color:var(--muted);font-size:.77rem;line-height:1.7}
.project-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:17px}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px}
/* Skill and technology names are descriptive labels everywhere; only real actions use button borders. */
.tag{display:inline-block;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font:500 .62rem/1.55 "DM Mono",monospace}
.tag:not(:last-child)::after{content:"·";display:inline-block;margin-left:9px;color:var(--accent)}
.project-link,.readme-link,.cert-info a,.minor-cert-info a,.aws-task-actions a,.aws-evidence-item>a{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid #c3c2b7;border-radius:2px;background:transparent;color:var(--ink-2);font-size:.67rem;font-weight:700;line-height:1.35;text-decoration:none;transition:background .16s,color .16s,border-color .16s,transform .16s}
.project-link:hover,.readme-link:hover,.cert-info a:hover,.minor-cert-info a:hover,.aws-task-actions a:hover,.aws-evidence-item>a:hover{transform:translateY(-1px);border-color:var(--accent);background:#f3e6df;color:var(--accent-dark);box-shadow:none}
.sap-project-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px}
.sap-verify-link{color:var(--ink-2)}
.project-content .readme-link{align-self:flex-start;margin-top:11px}
.sap-detail-launch{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 10px;border:1px solid #c3c2b7;border-radius:2px;background:rgba(251,249,242,.6);color:var(--ink-2);font-size:.7rem;font-weight:700;transition:background .16s,border-color .16s,color .16s}
.sap-detail-launch:hover{background:#f3e6df;border-color:var(--accent);color:var(--accent-dark)}
.sap-play-icon{display:inline-grid;place-items:center;width:22px;height:22px;flex:0 0 22px;border:1px solid #bdb7aa;background:#f0ede3;color:var(--accent);font-size:.55rem}
.sap-launch-arrow{margin-left:auto;color:var(--accent)}
.project-details{margin-top:12px;border:1px solid var(--rule);background:#f5f2e9;color:var(--muted);font-size:.76rem}
.project-details summary{padding:10px 12px;color:var(--ink-2);font-size:.72rem;font-weight:700;cursor:pointer}
.project-detail-content{padding:0 13px 13px}.project-detail-content h4{margin:10px 0 5px;color:var(--ink);font-size:.75rem}.project-detail-content p{margin:0 0 8px;font-size:.75rem}.project-detail-content ul{margin:0 0 9px;padding-left:20px}.project-detail-content li{margin:3px 0}
.sap-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sap-gallery a{display:block;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--rule);background:var(--surface-2)}
.sap-gallery img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}.sap-gallery a:hover img{transform:scale(1.02)}
.skill-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.skill-group{padding:17px 0 19px;border-top:1px solid var(--rule)}.skill-group.skill-aws{grid-column:1/-1}
.skill-group h3{margin:0 0 12px;color:var(--accent);font:500 .64rem "DM Mono",monospace;letter-spacing:.045em}
.skill-intro{max-width:320px;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}.chip{display:inline-block;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:.71rem;line-height:1.6;transition:none}.chip:not(:last-child)::after{content:"·";display:inline-block;margin-left:10px;color:var(--accent)}
.cert-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cert-card{display:grid;grid-template-columns:minmax(160px,.82fr) minmax(0,1.18fr);gap:0;border:1px solid var(--rule);border-radius:2px;background:var(--surface);overflow:hidden;transition:border-color .16s}
.cert-card:hover{border-color:#aaa99d}.cert-card>a{display:block;min-height:205px;background:#efeee8;border-right:1px solid var(--rule)}
.cert-img{height:100%;min-height:205px;display:grid;place-items:center;overflow:hidden;background:#efeee8}.cert-img img{display:block;width:100%;height:100%;object-fit:contain}
.cert-info{padding:17px 18px}.cert-info .mono{color:var(--accent);font-size:.59rem}.cert-info h3{margin:8px 0 9px;color:var(--ink);font:400 1.08rem/1.3 "DM Serif Display",Georgia,serif}.cert-info p{margin:0 0 9px;color:var(--muted);font-size:.72rem;line-height:1.7}.cert-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.cert-actions a{display:inline-flex}
.additional-cert-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 30px}
.additional-cert{display:grid;grid-template-columns:44px 1fr;align-items:start;gap:13px;padding:17px;border:1px solid var(--rule);background:var(--surface)}
.additional-cert h3{margin:5px 0 8px;color:var(--ink);font:400 1rem/1.35 "DM Serif Display",Georgia,serif}.additional-cert p{margin:0 0 10px;color:var(--muted);font-size:.72rem}
.additional-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid #c9c9bd;background:#eceee5;color:var(--forest);font:500 .7rem "DM Mono",monospace;border-radius:2px}
.additional-icon.azure,.additional-icon.python,.additional-icon.ai,.additional-icon.marketing{background:#eceee5;border-color:#c9c9bd;color:var(--forest)}
.cert-info a,.minor-cert-info a{margin-top:3px}
.minor-cert-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.minor-cert-card{border:1px solid var(--rule);background:var(--surface);overflow:hidden;transition:border-color .16s,transform .16s}
.minor-cert-card:hover{transform:translateY(-2px);border-color:#aaa99d}
.minor-cert-preview{display:block;height:155px;overflow:hidden;background:#eeece5;border-bottom:1px solid var(--rule)}
.minor-cert-preview img{display:block;width:100%;height:100%;object-fit:contain}
.minor-cert-info{padding:13px}.minor-cert-info .mono{color:var(--accent);font-size:.57rem}.minor-cert-info h3{min-height:2.7em;margin:6px 0 9px;color:var(--ink);font:400 .96rem/1.35 "DM Serif Display",Georgia,serif}
.achievement{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-block:1px solid var(--rule)}.achievement h3{margin:0;color:var(--ink);font:400 clamp(1.4rem,3vw,2.2rem) "DM Serif Display",Georgia,serif}.achievement p{margin:5px 0 0;color:var(--muted);font-size:.82rem}.achievement .star{color:var(--accent);font-size:1.5rem}
.honors-grid{display:grid;grid-template-columns:1fr}.honor-card{display:grid;grid-template-columns:42px 1fr;gap:15px;align-items:start;padding:20px;border:1px solid var(--rule);background:var(--surface)}.honor-icon{color:var(--accent);font:400 1.35rem "DM Serif Display",Georgia,serif}.honor-card h3{margin:3px 0 6px;font:400 1.3rem "DM Serif Display",Georgia,serif}.honor-card p{margin:0;color:var(--muted);font-size:.79rem}
.contact{display:grid;grid-template-columns:1fr .78fr;gap:45px;align-items:end;padding:clamp(25px,5vw,50px);border:1px solid var(--forest);background:var(--forest);color:var(--white)}
.contact .mono{color:#d0d6c8}.contact-title{margin:13px 0 23px;color:var(--white);font:400 clamp(3rem,6.4vw,5.8rem)/.98 "DM Serif Display",Georgia,serif;letter-spacing:-.04em}.contact-title span{color:#d6b39b;font-style:italic}
.contact .button.primary{background:var(--paper);border-color:var(--paper);color:var(--ink);box-shadow:none}.contact .button.primary:hover{background:#e4e0d4}

const tasks = [{"number": 2, "title": "VPC & Private Subnet", "meta": ["Task 02 / Networking & Security", "VPC / Networking"], "description": "Created a Virtual Private Cloud (VPC) named site1-vpc in the Ohio region (us-east-2) with the CIDR block 172.168.0.0/16.", "tags": ["VPC", "Networking"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Virtual Private Cloud (VPC) named site1-vpc in the Ohio region (us-east-2) with the CIDR block 172.168.0.0/16.</li><li>Set up a private subnet in us-east-2a with CIDR 172.168.1.0/24.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All configurations passed 100% of the validation checks.</li><li>Learned about VPC networking and subnet design in the cloud.</li><li>This is the beginning of the cloud journey, with continued focus on building AWS skills.</li></ul>", "image": "assets/aws-previews/vpc-private-subnet.jpg", "pdf": "assets/aws-proofs/vpc-private-subnet.pdf", "category": "Networking & Security"}, {"number": 3, "title": "Security Groups", "meta": ["Task 03 / Networking & Security", "VPC / Security"], "description": "Created a Security Group named Practice in the Ohio region (us-east-2).", "tags": ["VPC", "Security"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Security Group named Practice in the Ohio region (us-east-2).</li><li>Configured inbound rules to allow SSH traffic on port 22 and SMTPS traffic on port 465.</li><li>Configured an outbound rule to allow WinRM-HTTPS traffic on port 5986.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed successfully with 100% validation.</li><li>Learned how to control and secure traffic to and from AWS resources using Security Groups.</li><li>Strengthened understanding of cloud security best practices and network access management.</li></ul>", "image": "assets/aws-previews/security-groups.jpg", "pdf": "assets/aws-proofs/security-groups.pdf", "category": "Networking & Security"}, {"number": 4, "title": "Network ACLs", "meta": ["Task 04 / Networking & Security", "VPC / Security"], "description": "Created a Network ACL named Usernetwork in the Europe (Ireland) region (eu-west-1).", "tags": ["VPC", "Security"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Network ACL named Usernetwork in the Europe (Ireland) region (eu-west-1).</li><li>Inbound rules: allowed MySQL/Aurora traffic on port 3306 and denied RDP traffic on port 3389.</li><li>Outbound rules: allowed Oracle traffic on port 1521 and denied WinRM-HTTP traffic on port 5985.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed successfully with 100% validation.</li><li>Enhanced understanding of controlling inbound and outbound traffic at the subnet level using Network ACLs.</li><li>Strengthened cloud security and network management skills.</li></ul>", "image": "assets/aws-previews/network-acls.jpg", "pdf": "assets/aws-proofs/network-acls.pdf", "category": "Networking & Security"}, {"number": 5, "title": "Route 53 Private DNS", "meta": ["Task 05 / Networking & Security", "Route 53 / Networking"], "description": "Created a Private Hosted Zone named dev-test.com.", "tags": ["Route 53", "Networking"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Private Hosted Zone named dev-test.com.</li><li>Ensured the hosted zone is private and accessible only within the specified VPCs.</li><li>Created a DNS A Record named testing.dev-test.com.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Deepened understanding of internal domain resolution and DNS management in a cloud environment using AWS Route 53.</li><li>Built a foundation for more advanced configurations and certifications.</li></ul>", "image": "assets/aws-previews/route-53-private-dns.jpg", "pdf": "assets/aws-proofs/route-53-private-dns.pdf", "category": "Networking & Security"}, {"number": 6, "title": "EC2 & Application Load Balancer", "meta": ["Task 06 / Compute, Storage & Infrastructure", "EC2 / Elastic Load Balancing"], "description": "Launched two EC2 instances — serverinstance1 in us-west-2a and serverinstance2 in us-west-2b.", "tags": ["EC2", "Elastic Load Balancing"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Launched two EC2 instances — serverinstance1 in us-west-2a and serverinstance2 in us-west-2b.</li><li>Configured a Security Group to allow HTTP traffic on port 80 for both instances.</li><li>Created a Target Group named servertargets and registered both EC2 instances.</li><li>Set up an Application Load Balancer named serverelb listening on HTTP port 80 and linked it to the servertargets group.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Improved understanding of designing fault-tolerant and highly available architectures in AWS using Application Load Balancers.</li><li>Built experience applicable to real-world cloud deployments.</li></ul>", "image": "assets/aws-previews/ec2-application-load-balancer.jpg", "pdf": "assets/aws-proofs/ec2-application-load-balancer.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 7, "title": "Launch Template & Auto Scaling Group", "meta": ["Task 07 / Compute, Storage & Infrastructure", "EC2 / Auto Scaling"], "description": "Created a Launch Template named sample1.", "tags": ["EC2", "Auto Scaling"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Launch Template named sample1.</li><li>Configured the template with Amazon Linux 2023, instance type t2.micro or t3.micro, key pair sample1, and a 15 GB root volume.</li><li>Created an Auto Scaling Group named samplegroup.</li><li>Configured Availability Zones us-west-2a and us-west-2b.</li><li>Set maximum capacity to 4 instances, minimum capacity to 2 instances, and desired capacity to 2 instances.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Enhanced understanding of automated scaling, load distribution, and infrastructure resilience in AWS.</li></ul>", "image": "assets/aws-previews/launch-template-auto-scaling-group.jpg", "pdf": "assets/aws-proofs/launch-template-auto-scaling-group.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 9, "title": "S3 Versioning, Tags & File Upload", "meta": ["Task 09 / Compute, Storage & Infrastructure", "S3 / Storage"], "description": "Created an S3 bucket named coder<account-id> in the us-east-2 (Ohio) region.", "tags": ["S3", "Storage"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created an S3 bucket named coder&lt;account-id&gt; in the us-east-2 (Ohio) region.</li><li>Enabled Bucket Versioning for enhanced data durability.</li><li>Added a tag: Key = UsedFor, Value = FileUpload.</li><li>Uploaded a file named config.json to the root of the bucket.</li><li>Created a folder named assets/ within the bucket.</li><li>Ensured public read access for the config.json file.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Strengthened understanding of S3 versioning, tagging, and secure file accessibility in the cloud.</li><li>Continued building hands-on AWS storage expertise.</li></ul>", "image": "assets/aws-previews/s3-versioning-tags-file-upload.jpg", "pdf": "assets/aws-proofs/s3-versioning-tags-file-upload.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 10, "title": "EBS gp2 Volume", "meta": ["Task 10 / Compute, Storage & Infrastructure", "EBS / Block Storage"], "description": "Created a new SSD (gp2) EBS volume.", "tags": ["EBS", "Block Storage"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a new SSD (gp2) EBS volume.</li><li>Configured the volume size to 8 GiB.</li><li>Set the volume type explicitly as gp2.</li><li>Disabled KMS encryption to ensure the volume is not encrypted.</li><li>Added a tag with Key = ebs and Value = encryption_disabled.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Enhanced understanding of block storage, volume encryption, and tagging strategies in AWS.</li><li>Built practical exposure to AWS storage configuration.</li></ul>", "image": "assets/aws-previews/ebs-gp2-volume.jpg", "pdf": "assets/aws-proofs/ebs-gp2-volume.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 11, "title": "S3 Static Website — index.html", "meta": ["Task 11 / Compute, Storage & Infrastructure", "S3 / Static Website"], "description": "Created an S3 bucket named coder in the us-west-2 region.", "tags": ["S3", "Static Website"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created an S3 bucket named coder in the us-west-2 region.</li><li>Added a tag: Key = UsedFor, Value = StaticWebsite.</li><li>Uploaded index.html to the root and created a folder named image/, then uploaded image1.jpg.</li><li>Enabled public read access for the index.html file.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed.</li><li>Enhanced skills in S3 static website hosting and AWS storage services.</li></ul>", "image": "assets/aws-previews/s3-static-website-index-html.jpg", "pdf": "assets/aws-proofs/s3-static-website-index-html.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 14, "title": "S3 Static Website — home.html", "meta": ["Task 14 / Compute, Storage & Infrastructure", "S3 / Static Website"], "description": "Created an S3 bucket named coder<Your AWS Account ID> in the us-west-2 region.", "tags": ["S3", "Static Website"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created an S3 bucket named coder&lt;Your AWS Account ID&gt; in the us-west-2 region.</li><li>Enabled bucket versioning.</li><li>Uploaded home.html to the root directory.</li><li>Created an assets/ folder and uploaded banner.jpg.</li><li>Enabled public read access for the website files.</li><li>Activated Static Website Hosting and set the index document to home.html.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Learned how to deploy and manage a static website using AWS S3.</li><li>Gained hands-on experience in bucket versioning, access control, and hosting setup.</li><li>Understood how S3 can serve as a cost-effective web hosting solution.</li></ul>", "image": "assets/aws-previews/s3-static-website-home-html.jpg", "pdf": "assets/aws-proofs/s3-static-website-home-html.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 15, "title": "EFS Lifecycle & CloudWatch Alarm", "meta": ["Task 15 / Compute, Storage & Infrastructure", "EFS / Monitoring"], "description": "Confirmed the creation of the EFS named dev-efs.", "tags": ["EFS", "Monitoring"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Confirmed the creation of the EFS named dev-efs.</li><li>Verified that the lifecycle policy transitions files to Infrequent Access (IA) storage after 30 days.</li><li>Checked that a CloudWatch alarm named efs-alarm was created.</li><li>Ensured the alarm had a tag with key = efs and value = alarm.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Gained hands-on experience in EFS lifecycle management and optimisation.</li><li>Learned how to monitor storage health using CloudWatch alarms.</li><li>Strengthened skills in automated monitoring and resource tagging in AWS.</li></ul>", "image": "assets/aws-previews/efs-lifecycle-cloudwatch-alarm.jpg", "pdf": "assets/aws-proofs/efs-lifecycle-cloudwatch-alarm.pdf", "category": "Compute, Storage & Infrastructure"}, {"number": 8, "title": "Lambda Function, Version & Alias", "meta": ["Task 08 / Identity, Databases & Monitoring", "Lambda / Serverless"], "description": "Created a Lambda function named practice_lambda in the us-east-2 region.", "tags": ["Lambda", "Serverless"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a Lambda function named practice_lambda in the us-east-2 region.</li><li>Set the runtime to Python 3.9.</li><li>Configured memory size to 128 MB and timeout to 60 seconds.</li><li>Published the function's latest version.</li><li>Created an alias named user_alias pointing to the latest version.</li><li>Applied a Lambda function tag with key and value as String.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Enhanced skills in serverless architecture, function versioning, and alias management using AWS Lambda.</li></ul>", "image": "assets/aws-previews/lambda-function-version-alias.jpg", "pdf": "assets/aws-proofs/lambda-function-version-alias.pdf", "category": "Identity, Databases & Monitoring"}, {"number": 12, "title": "IAM Group & User", "meta": ["Task 12 / Identity, Databases & Monitoring", "IAM / Security"], "description": "Created an IAM Group named Network-L1-Team.", "tags": ["IAM", "Security"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created an IAM Group named Network-L1-Team.</li><li>Attached the policies AmazonVPCReadOnlyAccess and AWSNetworkManagerReadOnlyAccess.</li><li>Created an IAM User named Network-L1-User1.</li><li>Added the user to the Network-L1-Team group.</li></ul><h4>Outcome &amp; learning</h4><ul><li>All test cases passed with 100% success.</li><li>Gained practical experience in secure group management, policy attachment, and user-role assignments.</li><li>Practised secure access management in AWS.</li></ul>", "image": "assets/aws-previews/iam-group-user.jpg", "pdf": "assets/aws-proofs/iam-group-user.pdf", "category": "Identity, Databases & Monitoring"}, {"number": 13, "title": "RDS MySQL Instance", "meta": ["Task 13 / Identity, Databases & Monitoring", "RDS / Database"], "description": "Created a DB instance with the identifier mysqlinstance1.", "tags": ["RDS", "Database"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a DB instance with the identifier mysqlinstance1.</li><li>Selected the MySQL engine.</li><li>Configured the instance type as db.t3.micro.</li><li>Allocated 34 GB of storage.</li><li>Launched the RDS instance with the appropriate settings.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Learned how to set up a fully managed relational database in AWS.</li><li>Gained an understanding of scaling options, storage allocation, and instance configuration.</li><li>Acquired practical experience in RDS deployment and management.</li><li>Strengthened skills for real-world cloud database administration.</li></ul>", "image": "assets/aws-previews/rds-mysql-instance.jpg", "pdf": "assets/aws-proofs/rds-mysql-instance.pdf", "category": "Identity, Databases & Monitoring"}, {"number": 16, "title": "DynamoDB Table & Streams", "meta": ["Task 16 / Identity, Databases & Monitoring", "DynamoDB / NoSQL"], "description": "Navigated to the DynamoDB service in AWS Management Console.", "tags": ["DynamoDB", "NoSQL"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Navigated to the DynamoDB service in AWS Management Console.</li><li>Created a table named book.</li><li>Set Partition Key as author and Sort Key as bookName.</li><li>Enabled Streams with the New image option.</li><li>Deployed the table in the us-east-2 (Ohio) region.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Learned how to create and configure DynamoDB tables for structured data storage.</li><li>Understood stream-enabled tables for real-time change tracking.</li><li>Strengthened NoSQL database management and AWS DynamoDB configuration skills.</li></ul>", "image": "assets/aws-previews/dynamodb-table-streams.jpg", "pdf": "assets/aws-proofs/dynamodb-table-streams.pdf", "category": "Identity, Databases & Monitoring"}, {"number": 17, "title": "CloudWatch EC2 CPU Alarm", "meta": ["Task 17 / Identity, Databases & Monitoring", "CloudWatch / Monitoring"], "description": "Accessed AWS CloudWatch in the us-west-2 (Oregon) region.", "tags": ["CloudWatch", "Monitoring"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Accessed AWS CloudWatch in the us-west-2 (Oregon) region.</li><li>Selected the EC2 metric CPUUtilization for real-time monitoring.</li><li>Set a Static threshold for CPU ≥ 80%.</li><li>Defined a 5-minute period for accurate performance tracking.</li><li>Named the alarm EC2CPUUtilizationMonitor and validated its active status.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Gained hands-on experience in creating and managing CloudWatch alarms.</li><li>Understood how to monitor EC2 health metrics effectively.</li><li>Learned proactive alerting techniques for maintaining system performance.</li></ul>", "image": "assets/aws-previews/cloudwatch-ec2-cpu-alarm.jpg", "pdf": "assets/aws-proofs/cloudwatch-ec2-cpu-alarm.pdf", "category": "Identity, Databases & Monitoring"}, {"number": 18, "title": "IAM User & Read-Only Access", "meta": ["Task 18 / Identity, Databases & Monitoring", "IAM / Security"], "description": "Created a new IAM user named ActingUser.", "tags": ["IAM", "Security"], "details": "<summary>Technical steps &amp; learning outcomes</summary><h4>Implementation details</h4><ul><li>Created a new IAM user named ActingUser.</li><li>Assigned a tag with Key = Dynamo and Value = vpc.</li><li>Attached the AmazonDynamoDBReadOnlyAccess policy for database monitoring.</li><li>Attached the AmazonVPCReadOnlyAccess policy for network visibility.</li><li>Verified user permissions to ensure adherence to the least-privilege principle.</li></ul><h4>Outcome &amp; learning</h4><ul><li>Gained an understanding of the IAM user creation and policy attachment process.</li><li>Practised the principle of least privilege to secure access.</li><li>Acquired practical experience in AWS Identity and Access Management.</li></ul>", "image": "assets/aws-previews/iam-user-read-only-access.jpg", "pdf": "assets/aws-proofs/iam-user-read-only-access.pdf", "category": "Identity, Databases & Monitoring"}];

 `<div class="aws-detail-grid"><section class="aws-detail-panel"><div class="mono">PROJECT DETAILS</div><h2>Problem statement</h2><p>Resources in separate VPCs are isolated by default. The goal was to configure a VPC peering connection, route traffic between the two VPC CIDR blocks, apply appropriate security rules and verify private-IP communication between EC2 instances.</p><h3>Internship context</h3><p><strong>EWB Edutech Private Limited · AWS Internship</strong><br>Duration: 1 month · September–October 2026 · Remote</p><h3>Environment</h3><ul><li>Region: US East (Ohio), <code>us-east-2</code></li><li>VPC 1: <code>EWB_AWS_Internship_VPC1</code> — <code>28.0.0.0/16</code></li><li>VPC 2: <code>EWB_AWS_Internship_VPC2</code> — <code>28.200.0.0/16</code></li><li>Peering: <code>EWB_VPC_Peering</code> — connection shown as Active</li><li>VPC 1 EC2 instance had a public IPv4 address during testing; VPC 2 did not.</li><li>VPC 2 subnet name was not verified from available evidence.</li><li>These CIDRs are outside RFC 1918 private IPv4 ranges; use appropriate private ranges for production.</li></ul><h3>Implementation</h3><ul><li>Created and inspected the peering connection.</li><li>Configured route tables to route peer CIDR traffic through the peering connection.</li><li>Configured SSH and ICMP security-group rules for testing.</li><li>Used SSH/proxy access and ping tests to validate reachability.</li><li>Recorded a controlled ICMP failure, recovery test and cleanup evidence.</li></ul><h3>Results & learning</h3><p>The supplied terminal evidence shows successful forward and reverse ping tests with four packets received and 0% packet loss in the captured successful sessions. Screenshots document troubleshooting and cleanup. These results describe captured test sessions, not current AWS resource state.</p><h3>Architecture</h3><img class="aws-detail-image" src="./assets/aws-vpc-peering-target-architecture.png" alt="AWS VPC Peering target architecture"><div class="aws-detail-actions"><a href="./document.html?file=assets%2Faws-vpc-peering-target-architecture.png&amp;title=AWS%20VPC%20Peering%20Target%20Architecture&amp;back=aws">Open full-size image ↗</a></div><h3>Project report</h3><p>The full internship report and supporting repository remain available.</p><div class="aws-detail-actions"><a class="primary" href="./document.html?file=assets%2Faws-vpc-peering-project-report.pdf&amp;title=AWS%20VPC%20Peering%20Project%20Report&amp;back=aws">Open project report ↗</a><a href="https://github.com/sivakumar9867/EWB-AWS-Internship">View AWS repository ↗</a></div></section><section><div class="mono" style="margin-bottom:12px">PROJECT EVIDENCE · 17 SCREENSHOTS</div><div class="aws-detail-evidence-grid">${ev}</div></section></div>`;
