<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="#f3f0e7" name="theme-color"/><title>Project Details | Siva Kumar</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
:root{
 --paper:#f3f0e7;--surface:#fbf9f2;--surface-2:#e9e5d9;--surface-3:#e1e5d8;
 --ink:#252e28;--ink-2:#45534a;--muted:#6d786f;--rule:#cbc9bd;
 --accent:#a94f37;--accent-dark:#893b2a;--sage:#647963;--forest:#34483d;
 --white:#fffdf7;--max:1220px;--ease:cubic-bezier(.2,.7,.25,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.68 "DM Sans",Arial,sans-serif;overflow-x:hidden}
::selection{background:#d7dfce;color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{width:min(90%,var(--max));margin-inline:auto}
.mono{font:500 .66rem/1.5 "DM Mono",monospace;letter-spacing:.045em;color:var(--muted)}
.progress{position:fixed;z-index:150;top:0;left:0;width:0;height:3px;background:var(--accent)}
.nav{position:fixed;z-index:120;top:0;left:0;right:0;background:rgba(243,240,231,.96);border-bottom:1px solid var(--rule);transition:background .2s,border-color .2s}
.nav.scrolled{background:rgba(243,240,231,.985);border-color:#b9b8ac;box-shadow:0 2px 8px rgba(37,46,40,.04)}
.navin{height:78px;display:flex;align-items:center;justify-content:space-between;gap:26px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;font-size:.84rem;font-weight:700;letter-spacing:.015em}
.brand-stamp{display:grid;place-items:center;width:36px;height:36px;background:var(--accent);color:var(--white);font:500 .7rem "DM Mono",monospace;transform:rotate(-3deg);box-shadow:4px 4px 0 #d6d0c0}
.brand-name{display:flex;flex-direction:column;line-height:1.18}
.brand-name small{margin-top:3px;color:var(--muted);font:500 .54rem "DM Mono",monospace;letter-spacing:.07em;text-transform:uppercase}
.navlinks{display:flex;align-items:center;gap:clamp(10px,1.5vw,22px)}
.navlinks a{position:relative;padding:8px 0;color:#58645c;font-size:.72rem;font-weight:600;white-space:nowrap;transition:color .18s}
.navlinks a:after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:var(--accent);transition:right .18s var(--ease)}
.navlinks a:hover,.navlinks a.active{color:var(--accent-dark)}
.navlinks a:hover:after,.navlinks a.active:after{right:0}
.nav-cta{flex:0 0 auto;padding:9px 13px;border:1px solid var(--ink);border-radius:2px;font-size:.7rem;font-weight:700;transition:background .18s,color .18s,border-color .18s}
.nav-cta:hover{background:var(--accent);border-color:var(--accent);color:var(--white)}
.menu-btn{display:none;padding:8px 11px;border:1px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);font-size:.76rem}
main{display:block}
.hero{position:relative;min-height:720px;padding:150px 0 54px;display:flex;align-items:center;border-bottom:1px solid var(--ink);background:var(--paper)}
.hero:before{content:none!important;display:none!important}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.07fr) minmax(360px,.93fr);align-items:center;gap:clamp(36px,5.6vw,78px)}
.availability{display:flex;align-items:center;gap:10px;margin:0 0 23px;padding:0 0 0 12px;border-left:3px solid var(--accent);color:var(--muted);font:500 .64rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.status-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--sage)}
.hero h1{max-width:700px;margin:0;color:var(--ink);font:400 clamp(3.6rem,6.7vw,6.5rem)/.98 "DM Serif Display",Georgia,serif;letter-spacing:-.045em}
.hero h1 .name{color:var(--accent);font-style:italic;white-space:nowrap}
.hero-copy{max-width:620px;margin:25px 0 0;color:var(--ink-2);font-size:1.03rem;line-height:1.9}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:27px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:42px;padding:10px 15px;border:1px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);font-size:.73rem;font-weight:700;line-height:1.3;transition:background .18s,color .18s,border-color .18s,transform .18s}
.button:hover{transform:translateY(-2px);background:var(--ink);color:var(--white)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--white);box-shadow:4px 4px 0 rgba(169,79,55,.14)}
.button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);box-shadow:4px 4px 0 rgba(169,79,55,.1)}
.button.secondary{background:transparent;color:var(--ink)}
.button.secondary:hover{background:var(--ink);border-color:var(--ink);color:var(--white)}
.hero-right{min-height:475px;display:flex;align-items:center;justify-content:center;position:relative}
.workflow-sheet{position:relative;display:flex;flex-direction:column;width:min(100%,490px);min-height:625px;padding:25px 27px 20px;background:#e4e8dc;border:1px solid #aeb7a8;box-shadow:12px 12px 0 rgba(169,79,55,.13);color:var(--ink);transform:rotate(1deg)}
.workflow-sheet:before{content:"";position:absolute;inset:8px;border:1px solid rgba(37,46,40,.12);pointer-events:none}
.sheet-head,.sheet-foot{position:relative;display:flex;justify-content:space-between;gap:15px;color:#657366;font:500 .56rem "DM Mono",monospace;letter-spacing:.09em;text-transform:uppercase}
.sheet-head{padding-bottom:14px;border-bottom:1px solid rgba(37,46,40,.2)}
.sheet-title{position:relative;min-height:124px;padding:22px 0 15px;font:400 clamp(2.2rem,3.7vw,3.1rem)/1 "DM Serif Display",Georgia,serif;letter-spacing:-.035em}
.sheet-title em{color:var(--accent);font-style:italic}
.workflow-flow{position:relative;min-height:182px;padding:0 0 11px}
.workflow-step{position:relative;margin-left:12px;padding:12px 14px 11px 56px;border-left:1px solid #a5b09f;background:rgba(251,249,242,.58)}
.step-index{position:absolute;left:13px;top:14px;color:var(--accent);font:500 .57rem "DM Mono",monospace}
.workflow-step strong{display:block;font-size:.82rem;font-weight:700;line-height:1.35}
.workflow-step small{display:block;margin-top:3px;color:#69766b;font-size:.67rem;line-height:1.45}
.workflow-step-focus{border-left:3px solid var(--accent);background:rgba(251,249,242,.92)}
.workflow-step-output{border-left:1px solid var(--sage)}
.workflow-link{height:20px;display:flex;align-items:center;gap:10px;margin-left:26px;color:var(--accent)}
.workflow-link i{width:28px;height:1px;background:#9ba695}
.sheet-code{position:relative;min-height:82px;margin:8px 0 15px;padding:12px 14px;border:1px solid rgba(37,46,40,.15);background:rgba(251,249,242,.74);color:#56645a;font:500 .62rem/1.6 "DM Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.sheet-code b{color:var(--accent);font-weight:500}
.sheet-foot{margin-top:auto;min-height:48px;align-items:center;padding-top:13px;border-top:1px solid rgba(37,46,40,.2)}
.sheet-foot strong{color:var(--accent);font:500 .75rem "DM Mono",monospace}
.showcase-controls{display:flex;align-items:center;justify-content:space-between;gap:7px;flex:none;width:150px;margin-left:auto}.showcase-controls button{display:grid;place-items:center;width:30px;height:30px;border:1px solid #aeb7a8;border-radius:2px;background:transparent;color:var(--ink);font-size:1rem;line-height:1;cursor:pointer;transition:background .16s,border-color .16s,color .16s}.showcase-controls button:hover{border-color:var(--accent);background:#f3e6df;color:var(--accent-dark)}.showcase-controls output{min-width:49px;text-align:center;color:var(--accent);font:500 .63rem "DM Mono",monospace;font-variant-numeric:tabular-nums}
.inline-detail-panel[hidden]{display:none}.inline-detail-panel{margin-top:22px;padding:clamp(18px,3vw,28px);border:1px solid var(--rule);background:#eeece2;scroll-margin-top:100px}.inline-detail-panel .aws-route-head{margin-bottom:18px}.inline-detail-panel .aws-peering-layout{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}.inline-detail-panel .sap-detail-route-grid .aws-evidence-list{gap:12px}.inline-detail-panel .sap-detail-route-grid .aws-evidence-item img{max-height:460px;object-fit:contain}
.aws-route-view{scroll-margin-top:100px}.aws-route-view:empty{display:none}.aws-route-view:not(:empty){margin:24px 0 28px;padding:clamp(18px,3vw,28px);border:1px solid var(--rule);background:#eeece2}

.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:33px;color:#758076}
.scroll-cue{display:flex;align-items:center;gap:9px}.scroll-cue:before{content:"";width:25px;height:1px;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:32px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:17px 20px 18px 0;margin-right:18px;border:0;background:transparent}
.stat strong{display:block;color:var(--accent);font:400 2.1rem/1.15 "DM Serif Display",Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font:500 .6rem/1.5 "DM Mono",monospace;letter-spacing:.04em;text-transform:uppercase}
section{padding:92px 0;border-bottom:1px solid var(--rule);scroll-margin-top:78px}
.section-top{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:33px}
.section-number{margin-bottom:10px;color:var(--accent);font-size:.62rem}
.section-title{display:block;margin:0;color:var(--ink);font:400 clamp(2.5rem,4.8vw,4.5rem)/1.02 "DM Serif Display",Georgia,serif;letter-spacing:-.035em}
.section-title:after{content:"";display:block;width:48px;height:2px;margin-top:15px;background:var(--accent)}
.section-title .gradient,.section-title span.gradient{background:none!important;color:var(--accent)!important}
.section-note{max-width:370px;margin:0;color:var(--muted);font-size:.82rem;line-height:1.75}
.about-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:55px}
.about-text{color:var(--ink-2);font-size:.94rem;line-height:1.9}
.about-text p{margin:0 0 16px}.about-text strong{color:var(--ink);font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--rule)}
.info-card{display:grid;grid-template-columns:42px 118px 1fr;gap:13px;align-items:start;padding:15px 0;border:0;border-bottom:1px solid var(--rule);background:transparent}
.info-icon{margin:0;color:var(--accent)!important;font:400 1.2rem "DM Serif Display",Georgia,serif}
.info-card h3{margin:3px 0 0;color:var(--ink);font:500 .65rem "DM Mono",monospace;letter-spacing:.035em;text-transform:uppercase}
.info-card p{margin:0;color:var(--muted);font-size:.75rem;line-height:1.75}
.timeline{border-top:1px solid var(--ink)}
.experience{display:grid;grid-template-columns:175px minmax(0,1fr) 24px;gap:25px;padding:23px 0;border-bottom:1px solid var(--rule)}
.experience .date{padding-top:5px;color:var(--accent)!important;font-size:.62rem}
.experience h3{margin:0 0 7px;color:var(--ink);font:400 1.35rem/1.25 "DM Serif Display",Georgia,serif;letter-spacing:0}
.experience p{max-width:790px;margin:0;color:var(--muted);font-size:.82rem;line-height:1.8}
.experience .symbol{display:flex;justify-content:center;padding-top:4px;color:var(--accent);font-size:1rem}
.experience-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch}
.project-card{display:grid;grid-template-columns: minmax(150px,.72fr) minmax(0,1.28fr);min-width:0;border:1px solid var(--rule);border-radius:2px;background:var(--surface);box-shadow:4px 4px 0 rgba(37,46,40,.035);overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.project-card:hover{transform:translateY(-2px);border-color:#aeb0a3;box-shadow:6px 7px 0 rgba(169,79,55,.08)}
.sap-genai-project{grid-column:1/-1;grid-template-columns:minmax(230px,.75fr) minmax(0,1.25fr)}
.project-visual{min-height:220px;display:grid;place-items:center;padding:18px;overflow:hidden;background:#e4e8dc}
.sap-genai-visual{background:#e3e8d8!important}.salary-project .project-visual{background:#e8e2d4!important}.movie-project .project-visual{background:#efe1d9!important}.marks-project .project-visual{background:#e0e6e1!important}
.code-art{max-width:100%;padding:16px;border:1px solid rgba(37,46,40,.22);background:rgba(251,249,242,.86);color:#526057;font:500 .67rem/1.95 "DM Mono",monospace;overflow-wrap:anywhere;box-shadow:5px 5px 0 rgba(37,46,40,.05)}
.code-art b{color:var(--accent);font-weight:500}
.project-content{display:flex;flex-direction:column;min-width:0;padding:20px 21px}
.project-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:500 .58rem "DM Mono",monospace;letter-spacing:.025em}
.project-meta span:first-child{color:var(--accent)}
.project-content h3{margin:11px 0 8px;color:var(--ink);font:400 1.2rem/1.25 "DM Serif Display",Georgia,serif;letter-spacing:0}
.sap-genai-project .project-content h3{font-size:1.55rem}
.project-content>p{margin:0;color:var(--muted);font-size:.77rem;line-height:1.7}
.project-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:17px}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px}
/* Skill and technology names are descriptive labels everywhere; only real actions use button borders. */
.tag{display:inline-block;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font:500 .62rem/1.55 "DM Mono",monospace}
.tag:not(:last-child)::after{content:"·";display:inline-block;margin-left:9px;color:var(--accent)}
.project-link,.readme-link,.cert-info a,.minor-cert-info a,.aws-task-actions a,.aws-evidence-item>a{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid #c3c2b7;border-radius:2px;background:transparent;color:var(--ink-2);font-size:.67rem;font-weight:700;line-height:1.35;text-decoration:none;transition:background .16s,color .16s,border-color .16s,transform .16s}
.project-link:hover,.readme-link:hover,.cert-info a:hover,.minor-cert-info a:hover,.aws-task-actions a:hover,.aws-evidence-item>a:hover{transform:translateY(-1px);border-color:var(--accent);background:#f3e6df;color:var(--accent-dark);box-shadow:none}
.sap-project-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px}
.sap-verify-link{color:var(--ink-2)}
.project-content .readme-link{align-self:flex-start;margin-top:11px}
.sap-detail-launch{display:flex;align-items:center;gap:10px;margin-top:14px;padding:9px 10px;border:1px solid #c3c2b7;border-radius:2px;background:rgba(251,249,242,.6);color:var(--ink-2);font-size:.7rem;font-weight:700;transition:background .16s,border-color .16s,color .16s}
.sap-detail-launch:hover{background:#f3e6df;border-color:var(--accent);color:var(--accent-dark)}
.sap-play-icon{display:inline-grid;place-items:center;width:22px;height:22px;flex:0 0 22px;border:1px solid #bdb7aa;background:#f0ede3;color:var(--accent);font-size:.55rem}
.sap-launch-arrow{margin-left:auto;color:var(--accent)}
.project-details{margin-top:12px;border:1px solid var(--rule);background:#f5f2e9;color:var(--muted);font-size:.76rem}
.project-details summary{padding:10px 12px;color:var(--ink-2);font-size:.72rem;font-weight:700;cursor:pointer}
.project-detail-content{padding:0 13px 13px}.project-detail-content h4{margin:10px 0 5px;color:var(--ink);font-size:.75rem}.project-detail-content p{margin:0 0 8px;font-size:.75rem}.project-detail-content ul{margin:0 0 9px;padding-left:20px}.project-detail-content li{margin:3px 0}
.sap-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sap-gallery a{display:block;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--rule);background:var(--surface-2)}
.sap-gallery img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}.sap-gallery a:hover img{transform:scale(1.02)}
.skill-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.skill-group{padding:17px 0 19px;border-top:1px solid var(--rule)}.skill-group.skill-aws{grid-column:1/-1}
.skill-group h3{margin:0 0 12px;color:var(--accent);font:500 .64rem "DM Mono",monospace;letter-spacing:.045em}
.skill-intro{max-width:320px;color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}.chip{display:inline-block;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:.71rem;line-height:1.6;transition:none}.chip:not(:last-child)::after{content:"·";display:inline-block;margin-left:10px;color:var(--accent)}
.cert-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cert-card{display:grid;grid-template-columns:minmax(160px,.82fr) minmax(0,1.18fr);gap:0;border:1px solid var(--rule);border-radius:2px;background:var(--surface);overflow:hidden;transition:border-color .16s}
.cert-card:hover{border-color:#aaa99d}.cert-card>a{display:block;min-height:205px;background:#efeee8;border-right:1px solid var(--rule)}
.cert-img{height:100%;min-height:205px;display:grid;place-items:center;overflow:hidden;background:#efeee8}.cert-img img{display:block;width:100%;height:100%;object-fit:contain}
.cert-info{padding:17px 18px}.cert-info .mono{color:var(--accent);font-size:.59rem}.cert-info h3{margin:8px 0 9px;color:var(--ink);font:400 1.08rem/1.3 "DM Serif Display",Georgia,serif}.cert-info p{margin:0 0 9px;color:var(--muted);font-size:.72rem;line-height:1.7}.cert-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.cert-actions a{display:inline-flex}
.additional-cert-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 30px}
.additional-cert{display:grid;grid-template-columns:44px 1fr;align-items:start;gap:13px;padding:17px;border:1px solid var(--rule);background:var(--surface)}
.additional-cert h3{margin:5px 0 8px;color:var(--ink);font:400 1rem/1.35 "DM Serif Display",Georgia,serif}.additional-cert p{margin:0 0 10px;color:var(--muted);font-size:.72rem}
.additional-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid #c9c9bd;background:#eceee5;color:var(--forest);font:500 .7rem "DM Mono",monospace;border-radius:2px}
.additional-icon.azure,.additional-icon.python,.additional-icon.ai,.additional-icon.marketing{background:#eceee5;border-color:#c9c9bd;color:var(--forest)}
.cert-info a,.minor-cert-info a{margin-top:3px}
.minor-cert-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.minor-cert-card{border:1px solid var(--rule);background:var(--surface);overflow:hidden;transition:border-color .16s,transform .16s}
.minor-cert-card:hover{transform:translateY(-2px);border-color:#aaa99d}
.minor-cert-preview{display:block;height:155px;overflow:hidden;background:#eeece5;border-bottom:1px solid var(--rule)}
.minor-cert-preview img{display:block;width:100%;height:100%;object-fit:contain}
.minor-cert-info{padding:13px}.minor-cert-info .mono{color:var(--accent);font-size:.57rem}.minor-cert-info h3{min-height:2.7em;margin:6px 0 9px;color:var(--ink);font:400 .96rem/1.35 "DM Serif Display",Georgia,serif}
.achievement{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-block:1px solid var(--rule)}.achievement h3{margin:0;color:var(--ink);font:400 clamp(1.4rem,3vw,2.2rem) "DM Serif Display",Georgia,serif}.achievement p{margin:5px 0 0;color:var(--muted);font-size:.82rem}.achievement .star{color:var(--accent);font-size:1.5rem}
.honors-grid{display:grid;grid-template-columns:1fr}.honor-card{display:grid;grid-template-columns:42px 1fr;gap:15px;align-items:start;padding:20px;border:1px solid var(--rule);background:var(--surface)}.honor-icon{color:var(--accent);font:400 1.35rem "DM Serif Display",Georgia,serif}.honor-card h3{margin:3px 0 6px;font:400 1.3rem "DM Serif Display",Georgia,serif}.honor-card p{margin:0;color:var(--muted);font-size:.79rem}
.contact{display:grid;grid-template-columns:1fr .78fr;gap:45px;align-items:end;padding:clamp(25px,5vw,50px);border:1px solid var(--forest);background:var(--forest);color:var(--white)}
.contact .mono{color:#d0d6c8}.contact-title{margin:13px 0 23px;color:var(--white);font:400 clamp(3rem,6.4vw,5.8rem)/.98 "DM Serif Display",Georgia,serif;letter-spacing:-.04em}.contact-title span{color:#d6b39b;font-style:italic}
.contact .button.primary{background:var(--paper);border-color:var(--paper);color:var(--ink);box-shadow:none}.contact .button.primary:hover{background:#e4e0d4}
