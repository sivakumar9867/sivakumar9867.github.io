<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">AWS VPC Peering — Private Connectivity</title><desc id="desc">Two separate VPCs, each containing an EC2 instance, subnet, route table and security group, joined by a VPC peering connection.</desc>
<defs>
 <style>
 .eyebrow{font:600 18px 'DM Mono',monospace;letter-spacing:3px;fill:#a94f37}.title{font:700 35px 'DM Sans',Arial,sans-serif;fill:#252e28}.vpc-title{font:700 25px 'DM Sans',Arial,sans-serif;fill:#252e28}.small{font:500 17px 'DM Sans',Arial,sans-serif;fill:#6d786f}.label{font:700 19px 'DM Sans',Arial,sans-serif;fill:#34483d}.micro{font:500 15px 'DM Mono',monospace;fill:#6d786f}.panel{fill:#fbf9f2;stroke:#aeb5a6;stroke-width:2}.vpc{fill:#e5e8dd;stroke:#647963;stroke-width:3}.subnet{fill:#f3f0e7;stroke:#aeb5a6;stroke-width:2}.ec2{fill:#fbf9f2;stroke:#a94f37;stroke-width:2}.route{fill:#f5e7df;stroke:#a94f37;stroke-width:2}.security{fill:#e8e9df;stroke:#647963;stroke-width:2}.copper{stroke:#a94f37;stroke-width:5;fill:none;stroke-linecap:round}.sage{stroke:#647963;stroke-width:3;fill:none;stroke-linecap:round}
 </style>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a94f37"/></marker>
</defs>
<rect width="1600" height="820" fill="#f3f0e7"/>
<rect x="24" y="24" width="1552" height="772" fill="none" stroke="#cbc9bd" stroke-width="2"/>
<text x="72" y="84" class="eyebrow">CLOUD NETWORKING / FIELD NOTE 01</text>
<text x="72" y="137" class="title">AWS VPC Peering — Private IP Connectivity</text>
<text x="72" y="174" class="small">A private route between two independently configured virtual networks</text>
<!-- left VPC -->
<rect x="72" y="220" width="620" height="500" rx="4" class="vpc"/>
<text x="108" y="270" class="eyebrow">VPC 1</text><text x="108" y="310" class="vpc-title">EWB_AWS_Internship_VPC1</text><text x="108" y="342" class="micro">CIDR 28.0.0.0/16</text>
<rect x="110" y="372" width="544" height="206" rx="3" class="subnet"/>
<text x="137" y="410" class="micro">SUBNET / EC2 NETWORK</text>
<rect x="144" y="438" width="476" height="104" rx="3" class="ec2"/>
<text x="172" y="479" class="label">EC2 INSTANCE · VPC 1</text><text x="172" y="514" class="small">Private IP: 28.0.1.194</text>
<rect x="110" y="606" width="255" height="78" rx="3" class="route"/><text x="132" y="638" class="label">Route table</text><text x="132" y="663" class="micro">Peer CIDR via peering</text>
<rect x="380" y="606" width="274" height="78" rx="3" class="security"/><text x="402" y="638" class="label">Security group</text><text x="402" y="663" class="micro">SSH / ICMP test rules</text>
<!-- right VPC -->
<rect x="908" y="220" width="620" height="500" rx="4" class="vpc"/>
<text x="944" y="270" class="eyebrow">VPC 2</text><text x="944" y="310" class="vpc-title">EWB_AWS_Internship_VPC2</text><text x="944" y="342" class="micro">CIDR 28.200.0.0/16</text>
<rect x="946" y="372" width="544" height="206" rx="3" class="subnet"/>
<text x="973" y="410" class="micro">SUBNET / EC2 NETWORK</text>
<rect x="980" y="438" width="476" height="104" rx="3" class="ec2"/>
<text x="1008" y="479" class="label">EC2 INSTANCE · VPC 2</text><text x="1008" y="514" class="small">Private IP: 28.200.1.205</text>
<rect x="946" y="606" width="255" height="78" rx="3" class="route"/><text x="968" y="638" class="label">Route table</text><text x="968" y="663" class="micro">Peer CIDR via peering</text>
<rect x="1216" y="606" width="274" height="78" rx="3" class="security"/><text x="1238" y="638" class="label">Security group</text><text x="1238" y="663" class="micro">SSH / ICMP test rules</text>
<!-- peer -->
<path d="M654 490 C725 490 740 490 778 490" class="copper" marker-end="url(#arrow)"/>
<path d="M946 490 C875 490 860 490 822 490" class="copper" marker-end="url(#arrow)"/>
<rect x="730" y="420" width="140" height="140" rx="70" fill="#fbf9f2" stroke="#a94f37" stroke-width="3"/>
<text x="800" y="475" text-anchor="middle" class="eyebrow">VPC</text><text x="800" y="505" text-anchor="middle" class="label">PEERING</text><text x="800" y="531" text-anchor="middle" class="micro">Private routes</text>
<path d="M650 578 L700 578 L700 645 L730 645" class="sage"/><path d="M950 578 L900 578 L900 645 L870 645" class="sage"/>
<text x="72" y="760" class="micro">CONCEPTUAL DIAGRAM · REFER TO THE PROJECT REPORT AND CAPTURED CONSOLE EVIDENCE FOR IMPLEMENTED DETAILS</text>
</svg>